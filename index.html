<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タロット図鑑 | さくらこ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14131c;
    --surface: #1e1d2b;
    --surface-hover: #262536;
    --border: #322f42;
    --text: #ede8dc;
    --text-dim: #9c97ac;
    --gold: #c9a961;
    --gold-dim: #8a7642;
    --rose: #b5615a;
    --rose-dim: #7a453f;
    --neutral: #6e7f8c;
  }
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }
  .app { display:flex; min-height:100vh; }

  /* NAV RAIL */
  .rail {
    width: 96px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #17161f, #100f16);
    border-right: 1px solid var(--border);
    display:flex; flex-direction:column; align-items:center;
    padding: 26px 0 16px;
    gap: 8px;
  }
  .rail-title {
    font-family:'Fraunces',serif; font-size:11px; letter-spacing:.18em;
    color: var(--text-dim); writing-mode: vertical-rl; margin-bottom: 22px;
  }
  .rail-btn {
    width:64px; padding: 10px 4px; border-radius: 12px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-dim);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; font-family:'DM Sans',sans-serif; font-size:11px;
    transition: all .2s ease;
  }
  .rail-btn .ic { font-size:18px; }
  .rail-btn:hover { border-color: var(--gold-dim); color: var(--text); }
  .rail-btn.active {
    background: radial-gradient(circle at 35% 30%, #f0d9a0, var(--gold) 65%);
    color:#1a1508; border-color:var(--gold);
    box-shadow: 0 0 18px rgba(201,169,97,.4);
  }

  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar {
    padding: 26px 36px 16px; border-bottom:1px solid var(--border);
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  .brand h1 { font-family:'Fraunces',serif; font-weight:500; font-size:24px; margin:0 0 4px; }
  .brand p { margin:0; color:var(--text-dim); font-size:13px; }
  .search-box {
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:9px 14px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; width:220px;
  }
  .search-box::placeholder { color: var(--text-dim); }
  .search-box:focus { outline:none; border-color: var(--gold-dim); }

  .view { flex:1; padding: 22px 36px 60px; overflow-y:auto; }
  .view.hidden { display:none; }

  /* FILTER CHIPS */
  .chiprow { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 20px; }
  .chip {
    padding: 7px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:12.5px; cursor:pointer;
    transition: all .15s ease; letter-spacing:.02em;
  }
  .chip:hover { color:var(--text); border-color: var(--gold-dim); }
  .chip.active { background: var(--rose); border-color:var(--rose); color:#fff; }

  /* CARD GRID */
  .grid {
    display:grid; grid-template-columns: repeat(auto-fill, minmax(128px,1fr)); gap:14px;
  }
  .card-tile {
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    overflow:hidden; cursor:pointer; transition: all .18s ease;
  }
  .card-tile:hover { border-color: var(--gold-dim); transform: translateY(-2px); }
  .card-tile img { width:100%; display:block; aspect-ratio: 350/600; object-fit:cover; background:#0c0b12; }
  .card-tile .tlabel { padding:8px 9px 10px; }
  .card-tile .tname { font-family:'Fraunces',serif; font-size:13.5px; line-height:1.3; }
  .card-tile .tnum { color:var(--text-dim); font-family:'DM Mono',monospace; font-size:10.5px; margin-bottom:2px; display:block; }

  .empty { color:var(--text-dim); padding: 40px 0; text-align:center; font-size:14px; }

  /* MODAL */
  .modal-backdrop {
    position:fixed; inset:0; background: rgba(10,9,14,.72); backdrop-filter: blur(2px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal-backdrop.hidden { display:none; }
  .modal {
    background: var(--surface); border:1px solid var(--border); border-radius:16px;
    max-width: 780px; width:100%; max-height:88vh; overflow-y:auto;
    display:grid; grid-template-columns: 220px 1fr;
  }
  @media (max-width: 620px) { .modal { grid-template-columns: 1fr; } }
  .modal-img { background:#0c0b12; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-img img { width:100%; max-width:220px; border-radius:8px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .modal-body { padding: 26px 28px; position:relative; }
  .modal-close {
    position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:50%;
    background:var(--surface-hover); border:1px solid var(--border); color:var(--text-dim);
    cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .modal-eyebrow { color:var(--gold); font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  .modal-title { font-family:'Fraunces',serif; font-size:28px; margin: 4px 0 2px; }
  .modal-titleen { color:var(--text-dim); font-size:13px; margin-bottom:14px; }
  .kw-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom: 18px; }
  .kw { background: var(--surface-hover); border:1px solid var(--border); border-radius:999px; padding:4px 11px; font-size:11.5px; color: var(--text-dim); }
  .sec { margin-bottom: 16px; }
  .sec-h { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; }
  .sec-h.up { color: var(--gold); }
  .sec-h.rv { color: var(--neutral); }
  .sec-h.lv { color: var(--rose); }
  .sec p { margin:0; font-size:14.5px; line-height:1.75; color: var(--text); }

  /* DRAW VIEW */
  .draw-wrap { display:flex; flex-direction:column; align-items:center; padding-top: 24px; text-align:center; }
  .draw-lead { font-family:'Fraunces',serif; font-size:20px; margin-bottom:6px; }
  .draw-sub { color:var(--text-dim); font-size:13.5px; margin-bottom: 30px; }
  .deck-stage { width:180px; height:308px; position:relative; margin-bottom: 28px; perspective: 1000px; }
  .deck-back {
    width:100%; height:100%; border-radius:14px; cursor:pointer;
    background:
      radial-gradient(circle at 50% 42%, rgba(201,169,97,.35), transparent 60%),
      linear-gradient(155deg, #241f33, #14131c 70%);
    border: 1px solid var(--gold-dim);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
    transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
  }
  .deck-back .glyph { font-size:44px; color: var(--gold); opacity:.85; }
  .deck-back:hover { box-shadow: 0 18px 50px rgba(201,169,97,.18); }
  .deck-back.shuffling { animation: shuffle .9s ease; }
  @keyframes shuffle {
    0%,100% { transform: rotate(0deg) translateX(0); }
    20% { transform: rotate(-6deg) translateX(-6px); }
    40% { transform: rotate(5deg) translateX(5px); }
    60% { transform: rotate(-4deg) translateX(-4px); }
    80% { transform: rotate(3deg) translateX(3px); }
  }
  .deck-back.flipping { transform: rotateY(90deg); }
  .result-card { width:180px; display:none; flex-direction:column; align-items:center; margin-bottom: 10px; }
  .result-card.show { display:flex; animation: fadein .5s ease; }
  @keyframes fadein { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:translateY(0);} }
  .result-card img { width:100%; border-radius:12px; box-shadow: 0 16px 44px rgba(0,0,0,.55); }
  .result-card.reversed img { transform: rotate(180deg); }
  .result-orient { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.1em; margin-top:10px; padding:3px 10px; border-radius:999px; }
  .result-orient.up { background: rgba(201,169,97,.15); color: var(--gold); border:1px solid var(--gold-dim); }
  .result-orient.rv { background: rgba(110,127,140,.15); color: var(--neutral); border:1px solid var(--neutral); }
  .result-detail { max-width: 480px; text-align:left; margin-top: 22px; }
  .result-detail .modal-title { font-size:22px; }
  .draw-actions { display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; justify-content:center; }
  .btn {
    padding: 10px 20px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface-hover); color:var(--text); font-size:13.5px; cursor:pointer;
    font-family:'DM Sans',sans-serif; transition: all .15s ease;
  }
  .btn:hover { border-color: var(--gold-dim); }
  .btn.primary { background: var(--gold); border-color: var(--gold); color:#1a1508; font-weight:700; }
  .btn.primary:hover { background:#d8b872; }
  .btn.rose { background: var(--rose); border-color:var(--rose); color:#fff; }

  .note-box {
    width:100%; max-width:480px; margin-top:16px;
    background:var(--surface-hover); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:13.5px;
    resize:vertical; min-height:56px;
  }
  .note-box:focus { outline:none; border-color: var(--gold-dim); }

  /* JOURNAL */
  .journal-list { display:flex; flex-direction:column; gap:10px; max-width:640px; }
  .jentry { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; gap:14px; }
  .jentry img { width:52px; border-radius:6px; flex-shrink:0; }
  .jentry img.reversed { transform: rotate(180deg); }
  .jentry-body { flex:1; min-width:0; }
  .jentry-date { color: var(--text-dim); font-family:'DM Mono',monospace; font-size:11px; margin-bottom:2px; }
  .jentry-name { font-family:'Fraunces',serif; font-size:15px; margin-bottom:2px; }
  .jentry-orient { font-size:11px; color: var(--gold); margin-left:6px; }
  .jentry-orient.rv { color: var(--neutral); }
  .jentry-note { font-size:13px; color:var(--text-dim); margin-top:4px; white-space:pre-wrap; }
  .jentry-del { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:16px; align-self:flex-start; }
  .jentry-del:hover { color: var(--rose); }

  /* 時期読み */
  .timing-sec { max-width: 760px; margin-bottom: 34px; }
  .timing-h { font-family:'Fraunces',serif; font-size:16px; margin-bottom:12px; color:var(--gold); }
  .timing-table { border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .timing-row { display:grid; grid-template-columns: 140px 150px 1fr; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); align-items:center; }
  .timing-row:last-child { border-bottom:none; }
  .timing-row.head { background: var(--surface-hover); color:var(--text-dim); font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
  .timing-row .tc-name { font-family:'Fraunces',serif; font-size:14.5px; }
  .timing-row .tc-term { color:var(--gold); font-size:13px; }
  .timing-row .tc-feature { color:var(--text-dim); font-size:13px; }
  @media (max-width: 560px) {
    .timing-row { grid-template-columns: 1fr; gap:2px; padding:12px 14px; }
    .timing-row.head { display:none; }
  }

  ::-webkit-scrollbar { width:8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius:8px; }
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="rail-title">TAROT</div>
    <button class="rail-btn active" data-view="dict"><span class="ic">&#128214;</span>図鑑</button>
    <button class="rail-btn" data-view="draw"><span class="ic">&#127183;</span>1枚引く</button>
    <button class="rail-btn" data-view="timing"><span class="ic">&#8987;</span>時期読み</button>
    <button class="rail-btn" data-view="journal"><span class="ic">&#128221;</span>記録</button>
  </nav>

  <div class="main">
    <div class="topbar">
      <div class="brand">
        <h1 id="pageTitle">タロット図鑑</h1>
        <p id="pageSub">78枚のカードの意味を、いつでも気軽に。</p>
      </div>
      <input class="search-box" id="searchBox" placeholder="カード名で検索…">
    </div>

    <!-- 図鑑 VIEW -->
    <div class="view" id="view-dict">
      <div class="chiprow" id="chipRow">
        <div class="chip active" data-suit="all">すべて</div>
        <div class="chip" data-suit="major">大アルカナ</div>
        <div class="chip" data-suit="wands">ワンド（火）</div>
        <div class="chip" data-suit="cups">カップ（水）</div>
        <div class="chip" data-suit="swords">ソード（風）</div>
        <div class="chip" data-suit="pentacles">ペンタクル（地）</div>
      </div>
      <div class="grid" id="cardGrid"></div>
      <div class="empty" id="emptyMsg" style="display:none;">該当するカードが見つかりませんでした。</div>
    </div>

    <!-- 1枚引く VIEW -->
    <div class="view hidden" id="view-draw">
      <div class="chiprow" id="drawModeRow" style="justify-content:center;">
        <div class="chip active" data-mode="reading">カードを引く</div>
        <div class="chip" data-mode="timing">時期を引く</div>
      </div>
      <div class="draw-wrap">
        <div class="draw-lead" id="drawLead">今日のあなたへの1枚</div>
        <div class="draw-sub" id="drawSub">静かに一呼吸してから、カードをタップしてください。</div>
        <div class="deck-stage">
          <div class="deck-back" id="deckBack"><span class="glyph">&#10022;</span></div>
        </div>
        <div class="result-card" id="resultCard">
          <img id="resultImg" src="" alt="">
          <div class="result-orient" id="resultOrient"></div>
        </div>
        <div class="result-detail" id="resultDetail" style="display:none;">
          <div class="modal-eyebrow" id="rEyebrow"></div>
          <div class="modal-title" id="rTitle"></div>
          <div class="sec" id="rMeaningSec"><div class="sec-h up" id="rMeaningLabel">意味</div><p id="rMeaning"></p></div>
          <div class="sec" id="rLoveSec"><div class="sec-h lv">恋愛での視点</div><p id="rLove"></p></div>
          <div class="sec" id="rTimingTermSec" style="display:none;"><div class="sec-h up">時期の目安</div><p id="rTimingTerm"></p></div>
          <div class="sec" id="rTimingFeatureSec" style="display:none;"><div class="sec-h lv">時期としての特徴</div><p id="rTimingFeature"></p></div>
          <textarea class="note-box" id="drawNote" placeholder="今日の気づきや、心に浮かんだことをメモしておきましょう（任意）"></textarea>
          <div class="draw-actions">
            <button class="btn primary" id="saveDrawBtn">記録に残す</button>
            <button class="btn" id="redrawBtn">もう一度引く</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 時期読み VIEW -->
    <div class="view hidden" id="view-timing">
      <div class="timing-sec">
        <div class="timing-h">スート別の時期感（小アルカナ・数札）</div>
        <div class="timing-table" id="timingSuitTable"></div>
      </div>
      <div class="timing-sec">
        <div class="timing-h">コートカードの時期感（ペイジ／ナイト／クイーン／キング）</div>
        <div class="timing-table" id="timingCourtTable"></div>
      </div>
      <div class="timing-sec">
        <div class="timing-h">大アルカナの時期感</div>
        <div class="timing-table" id="timingMajorTable"></div>
      </div>
    </div>

    <!-- 記録 VIEW -->
    <div class="view hidden" id="view-journal">
      <div class="journal-list" id="journalList"></div>
      <div class="empty" id="journalEmpty" style="display:none;">まだ記録がありません。「1枚引く」から始めてみましょう。</div>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal">
    <div class="modal-img"><img id="modalImg" src="" alt=""></div>
    <div class="modal-body">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-eyebrow" id="mEyebrow"></div>
      <div class="modal-title" id="mTitle"></div>
      <div class="modal-titleen" id="mTitleEn"></div>
      <div class="kw-row" id="mKeywords"></div>
      <div class="sec"><div class="sec-h up">正位置</div><p id="mUp"></p></div>
      <div class="sec"><div class="sec-h rv">逆位置</div><p id="mRv"></p></div>
      <div class="sec"><div class="sec-h lv">恋愛での視点</div><p id="mLove"></p></div>
    </div>
  </div>
</div>

<script src="cards.js"></script>
<script src="timing.js"></script>
<script src="app.js"></script>
</body>
</html>
